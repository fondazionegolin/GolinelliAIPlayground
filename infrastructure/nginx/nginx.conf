worker_processes auto;
worker_rlimit_nofile 16384;

events {
    # Every live client keeps a Socket.IO connection open, and each one costs two
    # descriptors here (client + upstream): 1024 capped a busy school at ~500 users.
    worker_connections 8192;
}

http {
    # Docker assigns a new IP when a service container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # JSON API responses (chat history, projects, documents) were sent uncompressed.
    # text/event-stream is deliberately absent: SSE must not be buffered by gzip.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Reuse upstream connections instead of opening a new TCP connection per request.
    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 64;
    }

    # Multi-worker pool (API_ROLE=pool) for the stateless routes listed below.
    upstream api_pool {
        zone api_pool 64k;
        server api-pool:8000 resolve;
        keepalive 64;
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:80 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # SSE streaming endpoints — buffering MUST be disabled or NGINX
        # will buffer the entire stream and close the connection prematurely. Matches every
        # "-stream"/"/stream" route (chat-stream, message-stream, generate-stream, assist-stream,
        # jobs/{id}/stream, ...) instead of a hand-maintained list, so newly added streaming
        # endpoints get this automatically. "upstream"/"pull-upstream" don't match (no literal
        # "-stream"/"/stream" suffix) so they still fall through to the generic /api block below.
        location ~ ^/api/v1/.*(-stream|/stream)$ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            chunked_transfer_encoding on;
        }

        # Stateless, CPU-heavy routes -> multi-worker pool. Only add a prefix here after
        # checking its module keeps no in-process state (gateway presence dicts, background
        # jobs, Toy LM, drive sync locks); socket emits from the pool travel through Redis.
        # Regex locations match in order, so the SSE block above still wins for streams.
        # Routes of stateful modules that live under a pool prefix stay on the gateway.
        # backend/tests/test_pool_routing.py checks both regexes against the real routes.
        location ~ ^/api/v1/student/(studentbots|teacherbots|udas|live-interaction)(/|$) {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location ~ ^/api/v1/(auth|student|ml-lab|rag|files|credits|teacher-memory|alerts|feedback|privacy|media)(/|$) {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Drive uploads: larger bodies (DRIVE_MAX_UPLOAD_MB per file, several files per request).
        location = /api/v1/drive/upload {
            client_max_body_size 1G;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
        }

        location /api {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /socket.io {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # LiveKit WebSocket è esposto direttamente su wss://livekit.golinelli.ai (server separato).
        # Il proxy /livekit/ è stato rimosso: i client si connettono direttamente, non via nginx.

        location /metrics {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /uploads {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
