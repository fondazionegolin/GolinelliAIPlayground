name: ${COMPOSE_PROJECT_NAME:-golinelliaiplayground}

services:
  # Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT_80:-80}:80"
      - "${NGINX_PORT_443:-443}:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - eduai-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=/api/v1
    networks:
      - eduai-network
    restart: unless-stopped

  # API Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/chat_uploads:/app/uploads
      - ./data/toy_lm_checkpoints:/app/toy_lm_checkpoints
    env_file:
      - .env
    environment:
      # These override .env values with docker-internal hostnames
      - DATABASE_URL=postgresql+asyncpg://eduai:${DB_PASSWORD}@postgres:5432/eduai
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - PXT_COMPILER_URL=http://pxt-compiler:8090
      - TOY_LM_CHECKPOINT_DIR=/app/toy_lm_checkpoints
    # The RTX 4090 trains Toy LM and runs its generation; only the gateway owns that queue.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      pxt-compiler:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - eduai-network
    restart: unless-stopped

  # Multi-worker pool for the stateless, CPU-heavy routes (login, student join,
  # uploads/conversions, RAG ingestion, ML Lab saves). nginx sends only an
  # allow-list here; everything with in-memory state stays on `api`.
  api-pool:
    build:
      context: ./backend
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/chat_uploads:/app/uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://eduai:${DB_PASSWORD}@postgres:5432/eduai
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - PXT_COMPILER_URL=http://pxt-compiler:8090
      - API_ROLE=pool
      - SKIP_MIGRATIONS=1
      - UVICORN_WORKERS=${API_POOL_WORKERS:-4}
      # 4 workers x (5 + 5) connections, next to the gateway's 30: below Postgres' 100.
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=5
    depends_on:
      api:
        condition: service_healthy
    networks:
      - eduai-network
    restart: unless-stopped

  # MakeCode/PXT compiler for classroom boards
  pxt-compiler:
    build:
      context: ./services/pxt-compiler
      dockerfile: Dockerfile
    environment:
      - PORT=8090
      - PXT_HOME=/tmp/pxt-home
    networks:
      - eduai-network
    restart: unless-stopped

  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=eduai
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=eduai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduai -d eduai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduai-network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduai-network
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - ./data/minio:/data
    networks:
      - eduai-network
    restart: unless-stopped

  # Ollama for local LLM inference (GPU optional)
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./data/ollama:/root/.ollama
    # Uncomment below for GPU support (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - eduai-network
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - eduai-network
    restart: unless-stopped

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - eduai-network
    restart: unless-stopped

networks:
  eduai-network:
    driver: bridge
