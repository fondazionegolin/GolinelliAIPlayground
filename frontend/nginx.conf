server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # NOTE: Cross-Origin Isolation (COOP/COEP) is intentionally NOT set here.
    # It would enable SharedArrayBuffer for Pyodide's interactive input() (Worker + Atomics),
    # but it also blocks the cross-origin Sandpack bundler iframe used by the Coding Lab
    # ("Couldn't connect to server / TIME_OUT"). The Coding Lab takes priority; Pyodide's
    # input() degrades gracefully without SAB (see usePyodide.ts), everything else works.

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
