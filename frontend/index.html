<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_new.png" />
    <link href="https://db.onlinewebfonts.com/c/7615af7a9f681395bf515be718f1bf9c?family=SofiaPro" rel="stylesheet" type="text/css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golinelli AI Playground</title>
    <script>
      // Cross-origin isolation (COOP/COEP) is intentionally DISABLED: it makes the page
      // cross-origin isolated, which blocks the Coding Lab's Sandpack bundler iframe
      // ("Couldn't connect to server / TIME_OUT"). We no longer register the coi-serviceworker.
      // Clients that already installed it stay isolated, so proactively unregister it once.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var removedCoi = false;
          regs.forEach(function (reg) {
            var sw = reg.active || reg.waiting || reg.installing;
            if (sw && /coi-serviceworker/.test(sw.scriptURL)) {
              removedCoi = true;
              reg.unregister();
            }
          });
          // One reload after unregister drops the isolated context; guard against loops.
          if (removedCoi && !sessionStorage.getItem('coi-sw-removed')) {
            sessionStorage.setItem('coi-sw-removed', '1');
            location.reload();
          }
        }).catch(function (e) { console.warn('[COI-SW cleanup]', e); });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
