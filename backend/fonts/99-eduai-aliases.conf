<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  PDF/DOCX export runs through LibreOffice on a server without Microsoft fonts. Arial, Times New Roman,
  Courier New, Calibri and Cambria are covered by the metric-compatible Liberation/Carlito/Caladea
  families (fontconfig's stock metric aliases). The families below have no metric clone: map them to
  the closest installed face so line breaks stay as near as possible to what the editor shows.
-->
<fontconfig>
  <alias binding="same"><family>Aptos</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Garamond</family><prefer><family>EB Garamond</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Century Gothic</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Open Sans</family></prefer></alias>
  <alias binding="same"><family>Trebuchet MS</family><prefer><family>Open Sans</family></prefer></alias>
  <alias binding="same"><family>Comic Sans MS</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Impact</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial Black</family><prefer><family>Liberation Sans</family></prefer></alias>
</fontconfig>
